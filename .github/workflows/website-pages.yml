name: Deploy Website to GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-pages.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'apps/website/**'
      - '.github/workflows/website-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & test website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'yarn'
          cache-dependency-path: apps/website/yarn.lock

      - name: Install dependencies
        working-directory: apps/website
        run: yarn install --frozen-lockfile

      - name: Typecheck
        working-directory: apps/website
        run: yarn typecheck

      - name: Run tests
        working-directory: apps/website
        run: yarn test:ci

      - name: Lint
        working-directory: apps/website
        run: yarn lint

      - name: Build static website
        working-directory: apps/website
        run: yarn export
        env:
          OUTPUT_EXPORT: 'true'
          BASE_PATH: ${{ vars.BASE_PATH || (endsWith(github.repository, '.github.io') && '' || format('/{0}', github.event.repository.name)) }}

      - name: Upload GitHub Pages artifact
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/out

      - name: Upload preview artifact for PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: apps/website/out
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
